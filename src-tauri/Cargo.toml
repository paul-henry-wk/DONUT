[package]
name = "donut"
version = "1.0.0"
edition = "2021"

[dependencies]
tauri = { version = "~2.10", features = [] }
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
tokio = { version = "~1.50", features = ["process", "io-util", "macros"] }
reqwest = { version = "~0.12", features = ["json"] }
base64 = "~0.22"
thiserror = "~1.0"
urlencoding = "~2.1"
notify = { version = "~7.0" }
notify-debouncer-full = "~0.4"

[build-dependencies]
tauri-build = { version = "~2.5", features = [] }
