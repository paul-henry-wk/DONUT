[package]
name = "donut"
version = "1.0.0"
edition = "2021"

[dependencies]
tauri = { version = "~2.10", features = [] }
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
tokio = { version = "~1.50", features = ["process", "io-util", "macros", "time"] }
reqwest = { version = "~0.12", features = ["json"] }
base64 = "~0.22"
thiserror = "~1.0"
urlencoding = "~2.1"
notify = { version = "~7.0" }
sevenz-rust = "~0.6"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
notify-debouncer-full = "~0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
lto = "thin"
opt-level = "s"
codegen-units = 1
panic = "abort"

[build-dependencies]
tauri-build = { version = "~2.5", features = [] }
