name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so new pushes don't queue behind stale ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── TypeScript type check & frontend tests (Linux: faster + cheaper) ──
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Type check
        working-directory: app
        run: npx tsc --noEmit

      - name: Run frontend tests
        working-directory: app
        run: npm test

  # ── Rust lint & test (Windows: code targets Windows APIs) ──
  rust:
    runs-on: windows-latest
    env:
      # Incremental compilation hurts CI caching (large, low-reuse artifacts).
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Create frontend dist stub for Tauri build
        shell: bash
        run: mkdir -p app/dist

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test

  # ── Dependency audit (Linux: only reads lockfiles, no project build) ──
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Prebuilt cargo-audit binary (no source compilation).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Cargo audit
        working-directory: src-tauri
        run: cargo audit

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install npm dependencies
        working-directory: app
        run: npm ci

      - name: npm audit
        working-directory: app
        run: npm audit --audit-level=high

  # ── PowerShell Pester tests ──
  pester:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run Pester tests
        shell: pwsh
        env:
          DONUT_GUI: "1"  # Prevent interactive prompts
        run: |
          $result = Invoke-Pester -Path ./tests -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) {
            Write-Warning "$($result.FailedCount) test(s) failed."
            exit 1
          }
